<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>항공 GDS 서비스 기획자 포트폴리오</title>
  <meta name="description" content="항공 예약·발권·결제·환불 흐름을 설계해 온 서비스 기획자의 포트폴리오">
  <!-- 검색 결과에 노출되지 않게 합니다. 공개 검색을 원하면 이 줄을 지우세요. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="profile">
      <div class="identity">
        <h1 id="name"></h1>
        <p class="role" id="role"></p>
      </div>
      <p class="contact">
        <a id="email"></a>
        <button id="print" type="button">PDF로 저장</button>
      </p>
      <p class="summary" id="summary"></p>
      <dl class="facts" id="facts"></dl>
    </header>

    <main>
      <section class="row" id="career-section" hidden>
        <h2>경력</h2>
        <ul class="plain-list" id="career"></ul>
      </section>

      <section class="row">
        <h2>핵심 성과</h2>
        <div>
          <ul class="highlights" id="highlights"></ul>
          <p class="note">성과 수치는 비밀유지를 위해 범위로 표기했습니다.</p>
        </div>
      </section>

      <section class="row" id="projects">
        <h2>프로젝트</h2>
        <div>
          <div class="filter">
            <span id="filter-label">직무별 보기</span>
            <div id="roles" role="group" aria-labelledby="filter-label"></div>
          </div>
          <p class="role-message" id="role-message" aria-live="polite"></p>
          <div id="project-list"></div>
        </div>
      </section>

      <section class="row">
        <h2>역량</h2>
        <dl class="pairs" id="skills"></dl>
      </section>

      <section class="row" id="education-section" hidden>
        <h2>학력</h2>
        <ul class="plain-list" id="education"></ul>
      </section>

      <section class="row">
        <h2>AI 기획 제안</h2>
        <div>
          <p class="note ai-note" id="ai-intro"></p>
          <ul class="ideas" id="ideas"></ul>
        </div>
      </section>
    </main>
  </div>

  <noscript><p class="page">이 페이지의 내용을 보려면 JavaScript를 켜 주세요.</p></noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
