<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서비스 기획자 포트폴리오</title>
  <meta name="description" content="예약·결제 화면, 운영 관리자, API 연동을 기획한 서비스 기획자·PM 포트폴리오">
  <!-- 검색 결과에 노출되지 않게 합니다. 공개 검색을 원하면 이 줄을 지우세요. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="profile">
      <div class="profile-top">
        <div>
          <h1 id="name"></h1>
          <p class="role" id="role"></p>
          <ul class="scope" id="scope"></ul>
        </div>
        <button class="pdf" id="print" type="button">PDF로 저장</button>
      </div>
      <p class="headline" id="headline"></p>

      <dl class="contact" id="contact">
        <div><dt>휴대폰</dt><dd id="phone"></dd></div>
        <div><dt>이메일</dt><dd id="email"></dd></div>
      </dl>
      <form class="unlock" id="unlock" hidden>
        <label for="unlock-code">연락처 공개 코드</label>
        <input id="unlock-code" type="password" autocomplete="off" spellcheck="false">
        <button type="submit">확인 후 PDF 저장</button>
        <button type="button" id="unlock-cancel" class="quiet">닫기</button>
        <p class="unlock-msg" id="unlock-msg" aria-live="polite"></p>
      </form>

      <p class="summary" id="summary"></p>
      <dl class="facts" id="facts"></dl>
    </header>

    <main>
      <section class="sec">
        <h2>핵심 성과</h2>
        <div>
          <ul class="highlights" id="highlights"></ul>
          <p class="note">성과 수치는 비밀유지를 위해 범위로 표기했습니다.</p>
        </div>
      </section>

      <section class="sec">
        <h2>핵심 역량</h2>
        <dl class="strengths" id="strengths"></dl>
      </section>

      <section class="sec">
        <h2>경력 <small id="career-total"></small></h2>
        <ol class="career" id="career"></ol>
      </section>

      <section class="sec" id="projects">
        <h2>프로젝트</h2>
        <div>
          <div class="filter" id="filters" role="group" aria-label="프로젝트 분류"></div>
          <p class="filter-note" id="filter-note" aria-live="polite"></p>
          <div class="projects" id="project-list"></div>
        </div>
      </section>

      <section class="sec">
        <h2>학력</h2>
        <ul class="plain" id="education"></ul>
      </section>

      <section class="sec">
        <h2>스킬</h2>
        <dl class="skills" id="skills"></dl>
      </section>
    </main>
  </div>

  <noscript><p class="page">이 페이지의 내용을 보려면 JavaScript를 켜 주세요.</p></noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
